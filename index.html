<style>
/* Layout: one narrow column like a ring binder, bottom tab bar, sheets slide up for add/edit. Accent = red of a Chinese company seal (公章). */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde3ea;
  --ink:#16233a; --muted:#5d6a7e; --accent:#b8322a; --accent-soft:#f8e3e0;
  --ok:#2e7d4f; --ok-soft:#e1f2e7; --warn:#a96a00; --warn-soft:#fbefd6; --bad:#b8322a; --bad-soft:#f8e3e0;
  --nav:#16233a; --nav-ink:#c9d3e2; --bar:#c7d0dc;
  --f-display:"Frank Ruhl Libre","David",serif; --f-body:"Assistant","Segoe UI",Arial,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1622; --surface:#18212f; --surface-2:#1d2839; --line:#2a3649;
  --ink:#e8edf5; --muted:#97a3b6; --accent:#e5675d; --accent-soft:#3a1f1f;
  --ok:#6cc391; --ok-soft:#183026; --warn:#e3a944; --warn-soft:#352914; --bad:#ef7468; --bad-soft:#3a1f1f;
  --nav:#0a1019; --nav-ink:#8f9bb0; --bar:#34425a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-top:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;line-height:1.15} h2{font-size:21px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.banner{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;width:100%}
.row:last-child{border-bottom:0} .row:hover{background:var(--surface-2)}
.row .main{min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.cat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.count{text-align:center;min-width:56px}
.count b{display:block;font-family:var(--f-num);font-size:22px;line-height:1.1}
.count span{font-size:12px}
.st-ok{color:var(--ok)} .st-soon{color:var(--warn)} .st-bad{color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:#fff;text-align:center;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.yearbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.yearbar .y{font-family:var(--f-num);font-size:26px}
.yearbar button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.yearbar button:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat .l{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.stat .v{font-family:var(--f-num);font-size:19px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:130px}
.bar{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);position:absolute;bottom:0}
.bar.missing::after{content:"";width:100%;max-width:26px;height:3px;border-radius:2px;background:var(--line)}
.blabels{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.month{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:right;display:flex;flex-direction:column;gap:2px;min-height:78px}
.month .mn{font-weight:700}
.month .mv{font-family:var(--f-num);font-size:15px;direction:ltr;text-align:right}
.month.miss{border-style:dashed;background:transparent;color:var(--muted)}
.month.future{opacity:.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;color:var(--nav-ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;padding:6px 0;font-weight:600}
nav.tabs button[aria-current="page"]{color:#fff}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.drop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop label{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-weight:600;cursor:pointer;text-align:center;position:relative}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop.over label,.drop label.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-hint{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);margin-top:-4px}
.page-drop{position:fixed;inset:12px;z-index:70;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent);pointer-events:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:12px 0;min-width:0;outline:none}
.search button{background:none;border:0;color:var(--muted);font-size:18px;padding:4px}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.preview{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.preview img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.preview .main{min-width:0}
.ai{font-size:14px;border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.ai.busy{color:var(--muted)} .ai.done{background:var(--ok-soft)} .ai.err{background:var(--bad-soft)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;width:100%}
.field input.ltr{direction:ltr;text-align:right;font-family:var(--f-num)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.big-preview{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .main{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-weight:600;font-size:14.5px;max-width:90vw}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.seal{width:84px;height:84px;border:3px solid var(--accent);border-radius:16px;display:grid;place-items:center;color:var(--accent);font-family:var(--f-display);font-size:30px;font-weight:700;transform:rotate(-6deg)}
@media (max-width:420px){.months{grid-template-columns:repeat(2,1fr)} h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============ הגדרה אחת בלבד ============ */
const GOOGLE_CLIENT_ID = "425816596854-narl7a4c4r4qous1i2fliqjj72j7986u.apps.googleusercontent.com";   // ימולא אחרי ההגדרה ב-Google Cloud
/* ======================================== */

(() => {
const START_YEAR = 2025, START_MONTH = 9;
const WARN_DAYS = 183;   // התראה חצי שנה לפני שמסמך פג
const ROOT_NAME = "הכספת שלי", DATA_NAME = "vault-data.json";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const MSHORT = ["ינו","פבר","מרץ","אפר","מאי","יונ","יול","אוג","ספט","אוק","נוב","דצמ"];
const CATS = {
  passport:{he:"דרכון"}, visa:{he:"ויזה"}, residence:{he:"אשרת שהייה (居留许可)"}, id:{he:"תעודת זהות"},
  license:{he:"רישיון נהיגה"}, insurance:{he:"ביטוח"}, contract:{he:"חוזה / הסכם"}, other:{he:"אחר"}
};
const COLORS = ["#3d6fb6","#b8322a","#2e7d4f","#8a5a9e","#c07a12","#2c8a92"];
const fmt = new Intl.NumberFormat("he-IL",{maximumFractionDigits:2});
const money = v => (v==null||v==="")? "—" : "¥" + fmt.format(Number(v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (inner, s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const PAY_IC = '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v)}catch(e){} } };

const S = { token:null, tokenExp:0, rootId:null, dataId:null,
  data:{ profile:{ members:[{id:"me",name:"רועי",latin:"",color:COLORS[0]}], folders:{} }, items:{}, deleted:{} },
  ready:false, needAuth:false, error:null, tab: ls.get("vault.tab") || "home", year:new Date().getFullYear(),
  payMember:null, docMember:"all", docCat:"all" };
const clientId = () => GOOGLE_CLIENT_ID || ls.get("vault.clientId") || "";
const items = () => Object.values(S.data.items);
const members = () => S.data.profile.members;
const member = id => members().find(m=>m.id===id) || {id, name:"לא משויך", color:"#7a8597", latin:""};

const app = document.getElementById("app");
let toastT;
function toast(msg){ let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3000); }

/* ================= Google sign-in ================= */
let tokenClient = null, tokenWaiters = [];
{ const t = ls.get("vault.token"), e = +ls.get("vault.tokenExp"); if (t && e > Date.now()+60000) { S.token=t; S.tokenExp=e; } }
function gisReady(){ return new Promise(res=>{ const ch=()=> window.google?.accounts?.oauth2 ? res() : setTimeout(ch,100); ch(); }); }
async function initAuth(){
  await gisReady();
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId(), scope: SCOPE,
    callback: r => {
      if (r.error) { tokenWaiters.splice(0).forEach(w=>w.rej(r)); return; }
      S.token = r.access_token; S.tokenExp = Date.now() + (r.expires_in-60)*1000;
      ls.set("vault.token", S.token); ls.set("vault.tokenExp", String(S.tokenExp)); ls.set("vault.signedIn","1");
      tokenWaiters.splice(0).forEach(w=>w.res());
    },
    error_callback: e => tokenWaiters.splice(0).forEach(w=>w.rej(e)) });
}
function signIn(){ return new Promise((res,rej)=>{ tokenWaiters.push({res,rej}); tokenClient.requestAccessToken({prompt: ls.get("vault.signedIn")? "" : "consent"}); }); }
function signOut(){ if (S.token && window.google) google.accounts.oauth2.revoke(S.token, ()=>{}); S.token=null; ls.set("vault.token",null); ls.set("vault.tokenExp",null); ls.set("vault.signedIn",null); location.reload(); }

class NeedAuth extends Error {}
async function g(url, opts={}){
  if (!S.token || Date.now() > S.tokenExp) { S.needAuth=true; render(); throw new NeedAuth("auth"); }
  const r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:"Bearer "+S.token}});
  if (r.status===401) { S.token=null; ls.set("vault.token",null); S.needAuth=true; render(); throw new NeedAuth("auth"); }
  if (!r.ok) { let m=""; try{ m=(await r.json()).error?.message||"" }catch(e){} throw new Error("Drive "+r.status+(m?": "+m:"")); }
  return r;
}
const API = "https://www.googleapis.com/drive/v3/files", UP = "https://www.googleapis.com/upload/drive/v3/files";
async function driveFind(q){ const r = await g(API+"?q="+encodeURIComponent(q)+"&fields=files(id,name,parents)&spaces=drive"); return (await r.json()).files||[]; }
async function driveFolder(name, parent){ const r = await g(API+"?fields=id", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name, mimeType:"application/vnd.google-apps.folder", parents: parent?[parent]:undefined})}); return (await r.json()).id; }
async function driveUpload(blob, name, parent){
  const meta = {name, parents:[parent]};
  const fd = new FormData(); fd.append("metadata", new Blob([JSON.stringify(meta)],{type:"application/json"})); fd.append("file", blob);
  const r = await g(UP+"?uploadType=multipart&fields=id,name,size", {method:"POST", body: fd}); return await r.json(); }
async function driveRename(id, name, parent, oldParent){
  let url = API+"/"+id+"?fields=id"; if (parent && oldParent && parent!==oldParent) url += "&addParents="+parent+"&removeParents="+oldParent;
  await g(url, {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})}); }
async function driveTrash(id){ await g(API+"/"+id, {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({trashed:true})}); }
async function driveBlob(id){ return await (await g(API+"/"+id+"?alt=media")).blob(); }

/* ================= data in Drive ================= */
async function loadVault(){
  const found = await driveFind(`name='${DATA_NAME}' and trashed=false`);
  if (found.length) { S.dataId = found[0].id; S.rootId = found[0].parents?.[0]; Object.assign(S.data, await (await g(API+"/"+S.dataId+"?alt=media")).json()); }
  else {
    const roots = await driveFind(`name='${ROOT_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    S.rootId = roots[0]?.id || await driveFolder(ROOT_NAME);
    const r = await driveUpload(new Blob([JSON.stringify(S.data)],{type:"application/json"}), DATA_NAME, S.rootId); S.dataId = r.id;
  }
  S.data.items ||= {}; S.data.deleted ||= {}; S.data.profile ||= {}; S.data.profile.folders ||= {};
  if (!S.data.profile.members?.length) S.data.profile.members = [{id:"me",name:"רועי",latin:"",color:COLORS[0]}];
}
let saveChain = Promise.resolve();
function saveVault(){ saveChain = saveChain.then(doSave, doSave); return saveChain; }
async function doSave(){
  // merge with the copy in Drive, in case the phone and the computer both changed something
  try {
    const remote = await (await g(API+"/"+S.dataId+"?alt=media")).json();
    const del = {...(remote.deleted||{}), ...S.data.deleted};
    const merged = {...(remote.items||{})};
    for (const [id,it] of Object.entries(S.data.items)) if (!merged[id] || (it.updatedAt||0) >= (merged[id].updatedAt||0)) merged[id]=it;
    for (const id of Object.keys(del)) delete merged[id];
    S.data.items = merged; S.data.deleted = del;
    if ((remote.profile?.updatedAt||0) > (S.data.profile.updatedAt||0)) S.data.profile = {...remote.profile, folders:{...remote.profile.folders, ...S.data.profile.folders}};
  } catch(e){ if (e instanceof NeedAuth) throw e; }
  await g(UP+"/"+S.dataId+"?uploadType=media", {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(S.data)});
  render();
}
async function ensurePath(parts){
  const F = S.data.profile.folders; let parent = S.rootId, key = "";
  for (const p of parts) { key += "/"+p; if (!F[key]) { F[key] = await driveFolder(p, parent); S.data.profile.updatedAt = Date.now(); } parent = F[key]; }
  return parent;
}

/* ================= helpers ================= */
function countdown(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00"); if (isNaN(d)) return null;
  const days = Math.round((d - today())/864e5);
  if (days < 0) { const a=-days; const u = a<=60? a+" ימים" : a<730? Math.round(a/30.4)+" חודשים" : Math.floor(a/365)+" שנים"; return {days, big:"פג", u:"לפני "+u, st:"bad"}; }
  let n,u; if (days<=60){n=days;u=days===1?"יום":"ימים"} else if(days<730){n=Math.round(days/30.4);u="חודשים"} else {n=Math.floor(days/365);u="שנים"}
  return {days, n, big:String(n), u, st: days<=WARN_DAYS? "soon":"ok"};
}
const dmy = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${+d}/${+m}/${y}`; };
const numOrNull = s => { s=String(s||"").replace(/[,\s¥]/g,""); if(!s) return null; const n=Number(s); return isFinite(n)? n : null; };
const extOf = f => (f.name.match(/\.[a-z0-9]+$/i)||[""])[0] || (f.type==="application/pdf"?".pdf":".jpg");

function suggestPeriod(y, m, memberId){

  if (last) {
    const base = last.year*12 + (last.month-1);
    const f = new Date(last.periodFrom+"T00:00:00"), t = new Date(last.periodTo+"T00:00:00");
    const fo = f.getFullYear()*12+f.getMonth()-base, to = t.getFullYear()*12+t.getMonth()-base;
    const at = (off, day) => { const n = y*12+(m-1)+off; return iso(dayIn(Math.floor(n/12), n%12+1, day)); };
    return [at(fo, f.getDate()), at(to, t.getDate())];
  }
  return [iso(new Date(y, m-1, 1)), iso(new Date(y, m, 0))];
}

async function makePreview(file){
  if (file.type==="application/pdf" || /\.pdf$/i.test(file.name)) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    return await renderPdfPage(pdf, 1, 1600);
  }
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const k = Math.min(1, 1600/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
async function renderPdfPage(pdf, n, maxPx){
  const page = await pdf.getPage(n); const vp0 = page.getViewport({scale:1});
  const vp = page.getViewport({scale: Math.min(2.2, maxPx/Math.max(vp0.width,vp0.height))});
  const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); await page.render({canvasContext:ctx, viewport:vp}).promise;
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}

const PROMPT_PAY = `Read this payslip (most likely Chinese 工资条). Return ONLY JSON: {"year":int|null,"month":int|null (salary month 1-12),"net":number|null (实发工资/net pay),"tax":number|null (个人所得税),"social":number|null (employee 社保 total, null if none),"housing":number|null (住房公积金 employee part, null if none),"employer":string|null}. Plain numbers, no commas.`;
const PROMPT_DOC = `Read this personal document (passport, visa, Chinese residence permit 居留许可, ID, driving licence, insurance, contract). Return ONLY JSON: {"category":"passport"|"visa"|"residence"|"id"|"license"|"insurance"|"contract"|"other","title":short Hebrew name e.g. "דרכון ישראלי","holder":full name in Latin letters or null,"number":string|null,"issue":"YYYY-MM-DD"|null,"expiry":"YYYY-MM-DD"|null}`;
async function readWithAI(kind, blob, el, msg){
  msg("busy", kind==="payslip"? "קורא את התלוש…" : "מזהה את המסמך…");
  try {
    const b64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
    const r = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{ "content-type":"application/json", "x-api-key": ls.get("vault.aiKey"), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:"claude-haiku-5-5", max_tokens:400, messages:[{role:"user", content:[{type:"image", source:{type:"base64", media_type:"image/jpeg", data:b64}}, {type:"text", text: kind==="payslip"?PROMPT_PAY:PROMPT_DOC}]}] }) });
    if (!r.ok) throw new Error(r.status);
    const txt = (await r.json()).content?.find(c=>c.type==="text")?.text || "";
    const j = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}")+1));
    if (!document.body.contains(el)) return;
    const set = (id,val) => { const f=el.querySelector("#"+id); if(f && val!=null && val!=="") f.value=val; };
    if (kind==="payslip") {
      ["net","tax","social"].forEach(k=>set("f_"+k, j[k])); set("f_employer", j.employer);
      if (j.month>=1&&j.month<=12) set("f_month", j.month); if (j.year>2000) set("f_year", j.year);
      msg("done", `זוהה: ${j.month?MONTHS[j.month-1]:""} ${j.year||""}, נטו ${money(j.net)}. בדוק לפני שמירה.`);
    } else {
      if (CATS[j.category]) set("f_category", j.category); set("f_title", j.title); set("f_number", j.number); set("f_issue", j.issue); set("f_expiry", j.expiry);
      let who=""; if (j.holder) { const h=j.holder.toUpperCase(); const m=members().find(m=>m.latin && m.latin.split(/\s+/).every(p=>h.includes(p))); if(m){ set("f_member", m.id); who=" של "+m.name; } else who=` (${j.holder})`; }
      msg("done", `זוהה: ${j.title||"מסמך"}${who}${j.expiry?", בתוקף עד "+dmy(j.expiry):""}. בדוק לפני שמירה.`);
    }
  } catch(e){ if (document.body.contains(el)) msg("err","לא הצלחתי לקרוא אוטומטית. מלא את הפרטים ידנית."); }
}

async function saveForm(kind, it, pend, el){
  const gv = id => el.querySelector("#"+id)?.value?.trim() ?? "";
  const data = { ...it, kind, member:gv("f_member"), notes:gv("f_notes"), updatedAt:Date.now() };
  if (kind==="payslip") {
    Object.assign(data, { month:+gv("f_month"), year:+gv("f_year"), net:numOrNull(gv("f_net")), tax:numOrNull(gv("f_tax")),
      social:numOrNull(gv("f_social")), employer:gv("f_employer"), periodFrom:gv("f_from"), periodTo:gv("f_to"), currency:"CNY" });
    if (data.periodFrom && data.periodTo && data.periodFrom > data.periodTo) { const e=new Error(); e.userMsg="תאריך ההתחלה מאוחר מתאריך הסיום."; throw e; }
    if (!(data.year>1990 && data.year<2100)) { const e=new Error(); e.userMsg="השנה לא תקינה."; throw e; }
  } else Object.assign(data, { category:gv("f_category"), title:gv("f_title") || CATS[gv("f_category")]?.he, issue:gv("f_issue"), expiry:gv("f_expiry"), number:gv("f_number") });
  if (!data.id) { data.id = uid(); data.createdAt = Date.now(); }
  const ext = pend.file ? extOf(pend.file) : (data.fileName ? (data.fileName.match(/\.[a-z0-9]+$/i)||[""])[0] : "");
  const tgt = fileTarget(data, ext);
  const parent = await ensurePath(tgt.path);
  if (pend.file) {
    const up = await driveUpload(pend.file, tgt.name, parent);
    if (it.fileId) driveTrash(it.fileId).catch(()=>{});
    Object.assign(data, { fileId:up.id, fileName:tgt.name, mime:pend.file.type, folderId:parent });
  } else if (data.fileId && (tgt.name!==it.fileName || parent!==it.folderId)) {
    await driveRename(data.fileId, tgt.name, parent, it.folderId).catch(()=>{}); data.fileName=tgt.name; data.folderId=parent;
  }
  S.data.items[data.id] = data; await saveVault();
}

  } catch(e){}
}

window.addEventListener("dragleave", e=>{ if(!dropEl) return; if(--dragDepth<=0){ dropEl.remove(); dropEl=null; dragDepth=0; } });
window.addEventListener("dragover", e=>{ if(isFileDrag(e)) e.preventDefault(); });
window.addEventListener("drop", e=>{ if(!isFileDrag(e)) return; e.preventDefault(); if(dropEl){dropEl.remove(); dropEl=null;} dragDepth=0;
  if (!S.ready || scrimEl) return; const f=e.dataTransfer.files[0]; if(f) askKind(f); });

/* ================= search ================= */
const norm = t => String(t??"").toLowerCase();
function itemText(it){
  const m = member(it.member);
  if (it.kind==="payslip") return [ "תלוש", "שכר", MONTHS[it.month-1], it.month, it.year, `${it.month}/${it.year}`, m.name, it.employer, it.net, it.notes, it.fileName, dmy(it.periodFrom), dmy(it.periodTo) ].join(" ");
  return [ it.title, (CATS[it.category]||CATS.other).he, m.name, m.latin, it.number, it.expiry, dmy(it.expiry), it.notes, it.fileName ].join(" ");
}
function searchBox(key, ph){ return `<div class="search">${icon('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',18)}<input id="q_${key}" type="search" placeholder="${ph}" value="${esc(S[key]||"")}" autocomplete="off" aria-label="חיפוש"><button id="q_${key}x" aria-label="ניקוי" ${S[key]?"":"hidden"}>×</button></div>`; }
function bindSearch(key, onChange){
  const inp = document.getElementById("q_"+key); if(!inp) return;
  const clr = document.getElementById("q_"+key+"x");
  inp.oninput = ()=>{ S[key] = inp.value; clr.hidden = !S[key]; onChange(); };
  clr.onclick = ()=>{ S[key]=""; inp.value=""; clr.hidden=true; onChange(); inp.focus(); };
}
const matches = (it, q) => { const words = norm(q).split(/\s+/).filter(Boolean); const t = norm(itemText(it)); return words.every(w=>t.includes(w)); };
function searchResults(){
  const hits = items().filter(it=>matches(it, S.q))
    .sort((a,b)=> a.kind===b.kind ? (b.year||0)-(a.year||0) || (b.month||0)-(a.month||0) : a.kind==="doc"?-1:1);
  return hits.length ? `<div class="muted small">${hits.length} תוצאות</div><div class="list">${hits.map(it=> it.kind==="doc"? docRow(it) : payRow(it)).join("")}</div>`
                     : `<div class="empty">לא נמצא כלום עבור "${esc(S.q)}". אפשר לחפש לפי שם, סוג מסמך, חודש, שנה, מספר או מעסיק.</div>`;
}

/* ================= boot ================= */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
if (clientId() && S.token && Date.now() < S.tokenExp) start();
})();
</script>
</body>
